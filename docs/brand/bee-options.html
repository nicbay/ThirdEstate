<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;background:#e9e8e3;font-family:Archivo,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:16px}
.opt{background:#fff;border-radius:6px;overflow:hidden}
.opt h3{margin:0;padding:12px 18px 0;font:500 13px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:#666}
.opt p{margin:4px 18px 12px;font-size:14px;color:#444;line-height:1.35;min-height:76px}
.row{display:flex;align-items:center;gap:22px;padding:20px 18px}
.dark{background:#111216;color:#fff}
.lock{display:flex;align-items:center;gap:10px}
.lock svg{width:40px;height:40px}
.sans{font-weight:850;font-stretch:75%;text-transform:uppercase;font-size:26px;letter-spacing:.01em;line-height:1}
.sans span{font-weight:300;margin-left:.2em}
.fav{width:32px;height:32px;border-radius:6px;background:#111216;display:grid;place-items:center;flex:none}
.fav svg{width:26px;height:26px}
.fav16{width:16px;height:16px;flex:none}
.big{margin:0 auto}.big svg{width:150px;height:150px;display:block}
</style></head><body><div class="grid" id="g"></div>
<script>
const C=d=>({ink:d?'#fff':'#111216',bg:d?'#111216':'#fff',r:d?'#ff5a6a':'#e0313f',b:d?'#5b8dff':'#2f6bdc',wing:d?'rgba(255,255,255,.62)':'#b9c6e0'});
let uid=0;
// The bee, head up, stinger down, centred on x=16. Blade wings, horn antennae, angry eyes, chevron stripes, long stinger.
function body(c,eyeFill){const id='k'+(uid++);return `
<polygon points="13.6,12.6 2.2,6.4 4.6,11.6 12.4,15.6" fill="${c.wing}"/>
<polygon points="18.4,12.6 29.8,6.4 27.4,11.6 19.6,15.6" fill="${c.wing}"/>
<path d="M14.2 7.4 L11 2.6 M17.8 7.4 L21 2.6" stroke="${c.ink}" stroke-width="1.4" stroke-linecap="square"/>
<polygon points="12.6,7 19.4,7 20.6,9.6 16,12.2 11.4,9.6" fill="${c.ink}"/>
<polygon points="12.7,8.5 15.3,9.7 14.8,10.5 12.5,9.3" fill="${eyeFill}"/>
<polygon points="19.3,8.5 16.7,9.7 17.2,10.5 19.5,9.3" fill="${eyeFill}"/>
<polygon points="12.4,12.6 19.6,12.6 20.2,15.4 11.8,15.4" fill="${c.ink}"/>
<clipPath id="${id}"><polygon points="11.2,16.1 20.8,16.1 21.6,19.4 16,28.2 10.4,19.4"/></clipPath>
<g clip-path="url(#${id})"><rect x="9" y="15" width="14" height="14" fill="${c.ink}"/>
<polygon points="9,16.9 16,19.9 23,16.9 23,19.7 16,22.7 9,19.7" fill="${c.r}"/>
<polygon points="9,20.5 16,23.5 23,20.5 23,23.3 16,26.3 9,23.3" fill="${c.b}"/></g>
<polygon points="15.1,27.4 16.9,27.4 16,31.6" fill="${c.ink}"/>`}
// A · in the hexagon, the stinger breaks through its bottom point
function hexBee(d){const c=C(d);return `<svg viewBox="0 0 32 32"><polygon points="16,1.5 28.6,8.75 28.6,23.25 16,30.5 3.4,23.25 3.4,8.75" fill="none" stroke="${c.ink}" stroke-width="1.5" opacity=".9"/>${body(c,c.bg)}</svg>`}
// B · diving: the same bee pitched 35° into an attack, speed lines behind
function dive(d){const c=C(d);return `<svg viewBox="0 0 32 32"><path d="M3 4.5 L9 4.5 M1.5 8 L7 8 M4 1.5 L8.5 1.5" stroke="${c.ink}" stroke-width="1.1" stroke-linecap="round" opacity=".45" transform="rotate(-35 16 16)"/><g transform="translate(16 16.6) rotate(-35) scale(.94) translate(-16 -16)">${body(c,c.bg)}</g></svg>`}
// C · badge: solid hexagon, bee cut out of it; strongest at favicon size
function badge(d){const c=C(d),inv={ink:c.bg,bg:c.ink,r:c.r,b:c.b,wing:d?'rgba(17,18,22,.55)':'rgba(255,255,255,.7)'};return `<svg viewBox="0 0 32 32"><polygon points="16,0.6 29.4,8.3 29.4,23.7 16,31.4 2.6,23.7 2.6,8.3" fill="${c.ink}"/><g transform="translate(16 16) scale(.82) translate(-16 -16.4)">${body(inv,c.ink)}</g></svg>`}
const opts=[
 ['A · Dans l’alvéole','Blade wings swept back, horn antennae, narrowed eyes, chevron stripes. The stinger pierces the hexagon: the Third Estate breaking out of its cell.',hexBee],
 ['B · En piqué','The same bee diving into an attack, with speed lines. The most aggressive and the most movement, a bit busier at small sizes.',dive],
 ['C · Écusson','A solid hexagon with the bee cut out, like a regimental badge. Reads best as a 16px browser icon and as an app icon.',badge],
];
document.getElementById('g').innerHTML=opts.map(([t,d,f])=>`<div class="opt"><h3>${t}</h3><p>${d}</p>
<div class="row dark"><div class="lock">${f(true)}<div class="sans">Third<span>Estate</span></div></div><div class="fav">${f(true)}</div><div class="fav16">${f(true)}</div></div>
<div class="row"><div class="lock">${f(false)}<div class="sans" style="color:#111216">Third<span>Estate</span></div></div></div>
<div class="row" style="padding-top:0"><div class="big">${f(false)}</div></div></div>`).join('');
</script></body></html>
