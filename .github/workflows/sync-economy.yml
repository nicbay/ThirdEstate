# Weekly refresh of France's economic indicators (Eurostat and INSEE open APIs, no key) for the
# "La France en chiffres" page and its debt counter: public/data/economy.json.
# The underlying series are monthly at best (quarterly for debt), so once a week is plenty.
name: Sync economy

on:
  schedule:
    - cron: "10 7 * * 2" # Tuesdays 07:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-economy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # no dependencies needed: the script only uses fetch and node:fs
      - run: node scripts/sync-economy.mjs

      - name: Commit if the data changed
        run: |
          node scripts/data-changed.mjs public/data/economy.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/data/economy.json
          git commit -m "data: sync economy ($(date -u +%F))"
          git pull --rebase
          git push
