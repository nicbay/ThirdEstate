# Weekly refresh of France's economic indicators (Eurostat and INSEE open APIs, no key) for the
# "La France en chiffres" page and its debt counter: public/data/economy.json.
# The underlying series are monthly at best (quarterly for debt), so once a week is plenty.
name: Sync economy

on:
  schedule:
    - cron: "10 7 * * 2" # Tuesdays 07:10 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-economy
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write # push the refreshed data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # the token is given only to the push step

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # no dependencies needed: the script only uses fetch and node:fs
      - run: node scripts/sync-economy.mjs

      - name: Commit if the data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/data-changed.mjs public/data/economy.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/data/economy.json
          git commit -m "data: sync economy ($(date -u +%F))"
          git pull --rebase
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
