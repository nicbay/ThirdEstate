# Hourly refresh of polls (Wikipedia) and prediction markets (Kalshi, Polymarket), and the day's entry
# in the forecast history (public/data/forecast/history.json).
# Runs on GitHub's US servers, which can reach Polymarket (blocked from France).
name: Sync polls and markets

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-live
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write # push the refreshed data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # the token is given only to the push step

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Polls
        run: npm run sync:polls

      - name: Markets
        run: npm run sync:markets
        continue-on-error: true # keep the last good file if every market source is down

      # Today's forecast (polls + markets) into the daily record; also backfills past days with
      # Polymarket price history, which this US runner can reach and a French machine can't.
      - name: Forecast history
        run: npm run sync:forecast
        continue-on-error: true

      - name: Commit if the data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="public/data/markets.json $(ls public/data/polls/*.json) public/data/forecast/history.json"
          node scripts/data-changed.mjs $files || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "data: sync polls and markets ($(date -u +'%F %H:%M'))"
          git pull --rebase --autostash
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
