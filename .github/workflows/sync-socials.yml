# Weekly refresh of MPs' social accounts (public/data/an/socials.json).
# Free sources only; the optional AI step uses the ANTHROPIC_API_KEY secret if it exists
# (shared $15/month cap in scripts/lib/claude.mjs) and is skipped otherwise.
name: Sync MPs' social accounts

on:
  schedule:
    - cron: "45 8 * * 1" # Mondays 08:45 UTC, after the daily Assemblée sync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-budget # shares the Claude spending ledger with the feed job
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Social accounts
        run: node scripts/sync-socials.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit if anything changed
        run: |
          # socials-meta.json always changes (timestamp); only commit when accounts or the cache changed
          if git diff --quiet -- public/data/an/socials.json data/socials-cache.json data/usage 2>/dev/null && [ -z "$(git ls-files --others --exclude-standard data/usage)" ]; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/data/an/socials.json public/data/an/socials-meta.json data/socials-cache.json
          [ -d data/usage ] && git add data/usage
          git commit -m "data: sync MPs' social accounts ($(date -u +%F))"
          # other jobs push to the same branch (and write data/usage): rebase before pushing
          git pull --rebase
          git push
