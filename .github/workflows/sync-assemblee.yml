# Daily refresh of MPs and votes from Assemblée nationale open data.
# The Assemblée republishes its files every night (Paris time); this runs after.
name: Sync Assemblée nationale data

on:
  schedule:
    - cron: "30 7 * * *" # 07:30 UTC every day
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: sync-assemblee
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write # push the refreshed data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # the token is given only to the push step

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run sync:an

      # What MPs say in the chamber (word clouds, themes): ~60 MB zip of the verbatim record, ~30 s.
      # Runs after sync:an because it reads the fresh deputes.json.
      - run: npm run sync:interventions

      # The quiz's compact dataset (public/data/an/quiz.json), from the files above: local only, ~2 s.
      - run: npm run build:quiz

      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # meta.json files always change (sync timestamp); only commit when real data changed
          if git diff --quiet -- public/data/an ':!public/data/an/meta.json' ':!public/data/an/interventions/meta.json' &&[ -z "$(git ls-files --others --exclude-standard public/data/an)" ]; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/an
          git commit -m "data: sync Assemblée nationale ($(date -u +%F))"
          git pull --rebase --autostash
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
