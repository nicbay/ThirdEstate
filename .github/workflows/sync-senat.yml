# Daily refresh of senators, public votes and 2026 senatorial election results
# from the Sénat's open data (data.senat.fr, www.senat.fr) and data.gouv.fr.
# Votes already stored are reused; only new (and last-14-days) votes are fetched.
# Senators' pages, their own websites and Wikidata are refreshed weekly (data/senat-cache.json).
name: Sync Sénat data

on:
  schedule:
    - cron: "15 6 * * *" # 06:15 UTC every day (votes of the previous day are online by then)
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: sync-senat
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write # push the refreshed data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # the token is given only to the push step

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - run: node scripts/sync-senat.mjs

      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # meta.json always changes (sync timestamp) and elections-2026.json carries fetchedAt:
          # commit only when real data changed (scripts/data-changed.mjs ignores fetchedAt).
          changed=no
          node scripts/data-changed.mjs public/data/senat/senateurs.json public/data/senat/scrutins.json public/data/senat/elections-2026.json data/senat-cache.json && changed=yes
          if [ -n "$(git status --porcelain -- public/data/senat/votes)" ]; then changed=yes; fi
          if [ "$changed" = no ]; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/senat data/senat-cache.json
          git commit -m "data: sync Sénat ($(date -u +%F))"
          # other jobs push to the same branch: rebase before pushing
          git pull --rebase
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
